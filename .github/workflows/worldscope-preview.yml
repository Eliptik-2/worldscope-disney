name: Worldscope preview checks
on:
  push:
    branches: [development]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all JavaScript files
        run: |
          node --check map-explore.js
          node --check worldscope-v17.js
          node --check worldscope-v18.js
          node --check worldscope-v19.js
          node --check worldscope-v20.js
          node --check worldscope-v21.js
          node --check worldscope-v22.js
          node --check worldscope-v22-directions.js
          node --check worldscope-v23-models.js
          node --check worldscope-v23-directions.js
          node --check worldscope-v23-ui.js
          node --check worldscope-v24.js
          node --check worldscope-v25-rides.js
          node --check worldscope-v26-architecture.js
          node --test tests/worldscope-v23.test.cjs
          node --test tests/worldscope-v24.test.cjs
          node --test tests/worldscope-v25.test.cjs
          node --test tests/worldscope-v26.test.cjs
          node --test tests/worldscope-v21.test.cjs
          node --test tests/worldscope-v22.test.cjs
          node --test tests/worldscope-v18.test.cjs
          node --test tests/worldscope-v19.test.cjs
          node --test tests/worldscope-v20.test.cjs
      - name: Check HTML inline scripts, directory and wiring
        run: |
          python3 - <<'PY'
          import re, subprocess, json, tempfile, pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert 'worldscope-v17.js' in html and 'worldscope-v17.css' in html
          assert 'worldscope-ready' in html
          assert 'map-explore.js' in html
          assert 'worldscope-v25-rides.js' in html and 'worldscope-v25.css' in html
          assert 'worldscope-v26-architecture.js' in html
          data=json.loads(pathlib.Path('data.json').read_text(encoding='utf-8'))
          assert len(data)>=240, f"Directory has only {len(data)} entries"
          tags=re.findall(r'<script([^>]*)>(.*?)</script>',html,flags=re.S|re.I)
          inline=[code for attrs,code in tags if not re.search(r'\bsrc\s*=',attrs) and code.strip()]
          assert inline, 'No inline application script found'
          for i,code in enumerate(inline):
            with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as temp:
              temp.write(code)
              name=temp.name
            subprocess.run(['node','--check',name],check=True)
          print('PASS: '+str(len(data))+' entries, '+str(len(inline))+' inline JS scripts')
          PY
