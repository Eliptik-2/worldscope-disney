name: Worldscope digital twin data lab
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths: ['.github/workflows/worldscope-digital-twin.yml']
permissions:
  contents: read
concurrency:
  group: worldscope-digital-twin-lab
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate importer with synthetic fixtures
        run: node tools/digital-twin/prepare-buildings.test.mjs
      - name: Install Overture Maps client
        run: python -m pip install overturemaps
      - name: Acquire open building and building-part geometry
        run: |
          mkdir -p twin-data/raw twin-data/processed
          overturemaps download --bbox=-81.66,28.30,-81.50,28.45 -f geojson --type=building -o twin-data/raw/buildings.geojson
          overturemaps download --bbox=-81.66,28.30,-81.50,28.45 -f geojson --type=building_part -o twin-data/raw/parts.geojson
          python -m pip freeze > twin-data/raw/dependencies.txt
          date -u +%FT%TZ > twin-data/raw/acquired-utc.txt
      - name: Preserve source metadata and produce coverage report
        run: node tools/digital-twin/run.mjs twin-data/raw/buildings.geojson twin-data/raw/parts.geojson data.json twin-data/processed
      - name: Include source credit and review criteria
        run: cp docs/DIGITAL_TWIN.md twin-data/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: worldscope-digital-twin-study
          path: twin-data
          retention-days: 7
